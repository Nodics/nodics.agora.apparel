name: Agora Release Check

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - master
  pull_request:
    branches:
      - development
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    env:
      NODICS_KICKOFF_ROOT: ${{ github.workspace }}/reference-kickoff
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout reference renderer contracts
        uses: actions/checkout@v4
        with:
          repository: Nodics/nodics.kickoff
          ref: ${{ github.base_ref || github.ref_name }}
          path: reference-kickoff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
